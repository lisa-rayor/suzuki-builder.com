ServerName localhost
DirectoryIndex index.php
EnableSendfile Off
<Directory /var/www/html>
  Options -Indexes
  AllowOverride None
</Directory>
<LocationMatch "^/(?:\.|includ(?:/|$)|docs(?:/|$)|scripts(?:/|$)|docker(?:/|$)|README\.md$|SITE_CRAWL\.md$|compose\.yaml$)">
  Require all denied
</LocationMatch>
